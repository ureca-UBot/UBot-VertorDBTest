  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(() =&gt; {
  const root = document.getElementById(&#x27;vector-db-multi-axis&#x27;);
  const error = root.querySelector(&#x27;.error&#x27;);

  let data;
  try { data=JSON.parse(document.getElementById(&#x27;vector-db-scatter-data&#x27;).textContent); }
  catch (e) { error.hidden=false; error.textContent=&#x27;측정 데이터를 읽을 수 없습니다.&#x27;; return; }
  const dbs=[&#x27;pgvector&#x27;,&#x27;qdrant&#x27;,&#x27;weaviate&#x27;,&#x27;milvus&#x27;,&#x27;opensearch&#x27;];
  const colors=new Map(dbs.map((db,i)=&gt;[db,`var(--viz-series-${i+1})`]));
  const names={pgvector:&#x27;pgvector&#x27;,qdrant:&#x27;Qdrant&#x27;,weaviate:&#x27;Weaviate&#x27;,milvus:&#x27;Milvus&#x27;,opensearch:&#x27;OpenSearch&#x27;};
  const methods=new Map(data.methods.map(m=&gt;[m.id,m]));
  const symbolFor=m=&gt;m.db===&#x27;opensearch&#x27;&amp;&amp;m.engine===&#x27;Lucene&#x27;?d3.symbolCross:({hnsw:d3.symbolCircle,hfresh:d3.symbolStar,ivfflat:d3.symbolDiamond,ivf_flat:d3.symbolDiamond,ivf:d3.symbolDiamond,ivf_sq8:d3.symbolTriangle,ivf_pq:d3.symbolSquare,diskann:d3.symbolWye}[m.index.toLowerCase()]||d3.symbolCircle);
  const labelFor=m=&gt;`${names[m.db]} ${m.db===&#x27;opensearch&#x27;?m.engine+&#x27; &#x27;:&#x27;&#x27;}${m.index}`;
  const finite=v=&gt;typeof v===&#x27;number&#x27;&amp;&amp;Number.isFinite(v);
  const fields=[&#x27;recall&#x27;,&#x27;ur&#x27;,&#x27;fr&#x27;,&#x27;p95&#x27;,&#x27;up95&#x27;,&#x27;fp95&#x27;,&#x27;qps&#x27;,&#x27;cpu&#x27;,&#x27;ram&#x27;];
  const groups=data.groups.map(g=&gt;{
    const stats={};
    for(const key of fields){ const values=g.runs.map(r=&gt;r[key]).filter(finite); stats[key]={mean:d3.mean(values),median:d3.median(values),min:d3.min(values),max:d3.max(values)}; }
    return {...g,stats,methodInfo:methods.get(g.method),warmCount:g.runs.filter(r=&gt;!r.warm).length,suspectCount:g.runs.filter(r=&gt;r.suspect).length};
  });
  const groupMap=new Map(groups.map(g=&gt;[g.id,g]));
  const hidden=new Set(); let selected=null; let pinned=false;
  const tooltip=root.querySelector(&#x27;.tooltip&#x27;);
  const metrics={
    ur:{label:&#x27;무필터 Recall@10&#x27;,aggregate:&#x27;mean&#x27;,format:d3.format(&#x27;.2f&#x27;),recall:true},
    fr:{label:&#x27;필터 Recall@10&#x27;,aggregate:&#x27;mean&#x27;,format:d3.format(&#x27;.2f&#x27;),recall:true},

    ram:{label:&#x27;peak RAM (GiB)&#x27;,aggregate:&#x27;median&#x27;,format:d3.format(&#x27;~g&#x27;)},
